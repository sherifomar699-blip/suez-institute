<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0d1922;--card:#152633;--ink:#e6eef3;--mut:#94a9b8;--pri:#5bb4d0;--acc:#e0bb63;--line:#27414f;--soft:#1b3342;--hero:#0a141b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 'Readex Pro',Tahoma,'Segoe UI',sans-serif}

.sw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}

@media(max-width:780px){.hero>div{grid-template-columns:1fr}}
.hero{position:relative;overflow:hidden}.hero>div{position:relative;z-index:1}
.hero h1 span{background:linear-gradient(90deg,var(--acc),#fff,var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

.wv{position:absolute;bottom:-1px;left:0;width:200%;height:40px;z-index:1}.wv path{fill:var(--bg)}
.today h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-inline-end:8px}

.btn{transition:transform .2s}.btn:hover{transform:translateY(-2px)}
@keyframes fl{to{transform:translate(50px,35px) scale(1.18)}}@keyframes sh{to{background-position:-200% 0}}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}100%{box-shadow:0 0 0 10px rgba(46,204,113,0)}}@keyframes wave{to{transform:translateX(-50%)}}@keyframes pg{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:no-preference){.orb{animation:fl 14s ease-in-out infinite alternate}.o2{animation-direction:alternate-reverse}.hero h1 span{animation:sh 6s linear infinite}.today h3::before{animation:pl 1.6s infinite}.wv{animation:wave 14s linear infinite}#app>h2{animation:pg .5s both}.rv{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s,box-shadow .25s}.rv.in{opacity:1;transform:none}.card.rv.in:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(18,48,74,.14)}}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

#lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.94);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#lb[hidden]{display:none}#lb figure{margin:0;text-align:center;max-width:94vw}
#lb img{max-width:94vw;max-height:78vh;border-radius:10px;animation:pg .35s both}
#lb figcaption{color:#e6eef3;margin-top:10px}#lb small{color:#94a9b8}
#lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}

@media(prefers-reduced-motion:reduce){.ph img{transition:none}}

#sp .t1{font-size:clamp(28px,6vw,50px);font-weight:700;line-height:1.3}#sp .t2{font-size:clamp(16px,3.2vw,24px);font-weight:300;color:#b9cbd6}
#sp .sl{display:inline-block;margin-top:18px;padding:6px 22px;border-top:1px solid var(--acc);border-bottom:1px solid var(--acc);color:var(--acc);font-size:clamp(16px,3vw,22px);letter-spacing:.12em}
#sp .wv{bottom:0;height:70px;z-index:1}#sp .wv path{fill:rgba(91,180,208,.16)}
#sp .pb{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.08);z-index:3}#sp .pb i{display:block;height:100%;background:var(--acc);transform-origin:right;transform:scaleX(0)}
#sp .sk{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:3;background:rgba(255,255,255,.1);color:#e6eef3;border:0;border-radius:99px;padding:6px 16px;cursor:pointer}
.nt{margin:16px 0;padding:12px 16px;border-radius:12px;background:rgba(201,162,75,.16);border:1px solid var(--acc);border-inline-start:5px solid var(--acc);font-size:15px}.nt::before{content:"\26A0\FE0F  "}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes up{from{opacity:0;transform:translateY(24px)}}@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-90deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes bar{to{transform:scaleX(1)}}@keyframes gl{50%{filter:drop-shadow(0 0 18px rgba(201,162,75,.65))}}@keyframes ls{from{letter-spacing:.5em;opacity:0}}
@media(prefers-reduced-motion:no-preference){#sp .r1{stroke-dasharray:377;stroke-dashoffset:377;animation:dr 1.6s ease-out .2s forwards}#sp .r2{transform-origin:70px 70px;animation:sp 14s linear infinite}#sp .sq{transform-origin:70px 70px;animation:pop .9s cubic-bezier(.2,.8,.2,1) .5s both}#sp text{animation:up .7s ease-out 1.1s both}#sp .lg{animation:gl 2.4s ease-in-out 1.4s infinite}#sp .t1{animation:up .8s ease-out 1.3s both}#sp .t2{animation:up .8s ease-out 1.7s both}#sp .sl{animation:ls 1.1s ease-out 2.2s both}#sp .pb i{animation:bar 4s linear forwards}}
@media(prefers-reduced-motion:reduce){#sp .pb i{transform:none}}
</style></head><body>

<footer>معهد السويس العالي لنظم المعلومات الإدارية — معاً لمستقبل أفضل<br>الدراسة أربع سنوات · برنامج نظم المعلومات الإدارية<br>نسخة تجريبية غير رسمية، ولا علاقة لها بالمعهد أو بإدارته.</footer>

<script>
const notice=()=>`<div class="nt" role="note"><b>تنويه:</b> هذا الموقع <b>نسخة تجريبية</b> وليس موقعاً رسمياً، ولا علاقة له بمعهد السويس العالي لنظم المعلومات الإدارية أو بإدارته.</div>`;
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TS=['٩ – ١١','١١ – ١','١ – ٣'];
const LV=['الأول','الثاني','الثالث','الرابع'];
const P={my:'أ.د/ محمد يونس',hr:'د/ هاني رشدي',as:'أ.م.د/ أيمن صابر',ks:'د/ خالد الشاذلي',na:'د/ نبيل أمين',se:'د/ أسماء سعيد',am:'د/ أمينة أحمد',mz:'د/ محمد ظريف',sq:'د/ سامح قطب',sa:'د/ سعيد قطب',ar:'د/ أمل رضوان',rs:'د/ رضا عبد الصادق',ml:'د/ منعم لطفي',hg:'د/ هبة غريب',ah:'د/ أحمد حسام',ss:'د/ صديق السيد صديق',fa:'أ.د/ فهيم أبو العزم',nt:'د/ نهى عاطف',ap:'د/ أمينة محمد'};
const PK=Object.keys(P),code=k=>'D'+String(PK.indexOf(k)+1).padStart(2,'0');
const c={mg:['مبادئ الإدارة','ar rs'],lg:['لغة أجنبية','ah na'],ec:['مبادئ الاقتصاد','my'],hu:['حقوق الإنسان','ml hg'],lw:['مبادئ القانون','sa'],ac:['مبادئ المحاسبة','as hr'],
cl:['القانون التجاري','sa'],lo:['إدارة اللوجستيات وسلاسل الإمداد','ss se'],mi:['مبادئ الاقتصاد الجزئي','my'],c1:['محاسبة تكاليف','ah'],c2:['محاسبة تكاليف','fa'],mk:['مبادئ التسويق','ss'],
iv:['مبادئ الاستثمار','as hr'],db:['قواعد البيانات','ks na'],hm:['إدارة الموارد البشرية','se'],tx:['محاسبة ضرائب','am mz'],inf:['البنية التحتية لنظم المعلومات','na sq'],ma:['اقتصاد كلي','my'],
es:['أنظمة معلومات المؤسسات','sq ks'],eb:['إدارة الأعمال الإلكترونية','rs ar'],pf:['مبادئ المالية العامة','my nt'],sp:['محاسبة المنشآت المتخصصة','mz ap'],st:['الإحصاء التطبيقي','hg ml']};
const N=0,Z=(a)=>a.map(k=>k?c[k]:null);
// [مستوى, مجموعة, مدرج, يوم1, مواد1, يوم2, مواد2]
const S=[[1,'أ',1,'الأحد',Z(['mg','lg','ec']),'الاثنين',Z(['hu','lw','ac'])],
[1,'ب',3,'الأحد',Z(['lg','ec','mg']),'الاثنين',Z(['ac','hu','lw'])],
[2,'أ',2,'الأحد',Z(['cl','lo',0]),'الثلاثاء',Z(['mi','c1','mk'])],
[2,'ب',4,'الأحد',Z(['mk','cl','lo']),'الثلاثاء',Z(['c2','mi',0])],
[3,'أ',1,'الاثنين',Z(['iv','db','hm']),'الأربعاء',Z(['tx','inf','ma'])],
[3,'ب',3,'الاثنين',Z(['db','hm','iv']),'الأربعاء',Z(['inf','ma','tx'])],
[4,'أ',2,'الثلاثاء',Z(['es','eb',0]),'الأربعاء',Z(['pf','sp','st'])],
[4,'ب',4,'الثلاثاء',Z([0,'es','eb']),'الأربعاء',Z(['sp','st','pf'])]];
const L=[];S.forEach(([l,g,h,d1,r1,d2,r2])=>[[d1,r1],[d2,r2]].forEach(([d,r])=>r.forEach((x,i)=>x&&L.push({l,g,h,d,i,s:x[0],p:x[1].split(' ')}))));
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let V='home',U=null,SL=1,SG='أ',ROLE='student',ERR='';
let STU=ld('sti_s',[{c:'2026001',p:'1234',n:'طالب تجريبي (الأول)',l:1,g:'أ'},{c:'2026002',p:'1234',n:'طالب تجريبي (الثاني)',l:2,g:'ب'},{c:'2026003',p:'1234',n:'طالب تجريبي (الثالث)',l:3,g:'أ'},{c:'2026004',p:'1234',n:'طالب تجريبي (الرابع)',l:4,g:'ب'}]);
let ANN=ld('sti_a',[{t:'بدء الفصل الدراسي الأول 2026/2027 — يرجى مراجعة جدول المحاضرات الخاص بمجموعتكم.',d:'أكتوبر 2026'}]);

const cell=x=>x?`<b>${x[0]}</b><small>${x[1].split(' ').map(k=>P[k]).join('<br>')}</small>`:'<span class="em">—</span>';
function sched(l,g){const s=S.find(x=>x[0]==l&&x[1]==g);if(!s)return'';
const row=(d,r)=>`<tr><th>${d}</th>${r.map(cell=>`<td>${cell?`<b>${cell[0]}</b><small>${cell[1].split(' ').map(k=>P[k]).join('<br>')}</small>`:'<span class="em">—</span>'}</td>`).join('')}</tr>`;
return `<p class="note">المستوى ${LV[l-1]} — المجموعة ${g} — مدرج ${s[2]}</p><div class="sw"><table><thead><tr><th>اليوم / الساعة</th>${TS.map(t=>`<th>من ${t}</th>`).join('')}</tr></thead><tbody>${row(s[3],s[4])}${row(s[5],s[6])}</tbody></table></div>`}

if(await mk(c,p,{role:'student',name:n,level:+$('#sl').value,grp:$('#sg').value})){await loadS();render()}}
async function delS(i){if(!confirm('حذف بيانات الطالب؟ لن يتمكن من الدخول بعدها.'))return;await sb.from('profiles').delete().eq('id',STU[i].id);await loadS();render()}
const docForm=()=>`<div class="card f"><div><label>عضو هيئة التدريس</label><select id="dk">${PK.map(k=>`<option value="${k}">${code(k)} — ${P[k]}</option>`).join('')}</select></div><div><label>الرقم السري (6 أحرف فأكثر)</label><input id="dp"></div><button class="btn" onclick="addD()">إنشاء الحساب</button></div><p class="note">كود الدخول للدكتور هو الكود الظاهر قبل اسمه (مثل D02).</p>`;
async function addD(){const k=$('#dk').value,p=$('#dp').value;if(p.length<6){alert('الرقم السري 6 أحرف على الأقل.');return}if(await mk(code(k),p,{role:'doctor',name:P[k],doc_key:k}))alert('تم إنشاء حساب '+P[k]+' — الكود: '+code(k))}
async function upM(){const f=$('#mf').files[0],t=$('#mt').value.trim();if(!f||!t){MSG='اختر ملف PDF أو صورة واكتب عنوان المحاضرة.';return render()}
if(!/^(application\/pdf|image\/)/.test(f.type)){MSG='الملفات المسموحة PDF أو صور فقط.';return render()}
const path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+(f.type.includes('pdf')?'.pdf':'.jpg');
const u=await sb.storage.from('materials').upload(path,f,{contentType:f.type});if(u.error){MSG='تعذر الرفع: '+u.error.message;return render()}
const r=await sb.from('materials').insert({course:$('#mc').value,title:t,file_path:path,file_type:f.type,author_name:U.n});MSG=r.error?'تعذر الحفظ: '+r.error.message:'تم رفع المحاضرة.';render()}
async function loadM(){const e=$('#ml');if(!e)return;if(!U){e.innerHTML='<p class="note">سجّل الدخول لعرض المحاضرات.</p>';return}
const {data}=await sb.from('materials').select('*').order('created_at',{ascending:false});MAT=(data||[]).filter(x=>!MC||x.course==MC);
e.innerHTML=MAT.length?MAT.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b><div class="note">${esc(x.course)} · ${esc(x.author_name||'')} · ${fd(x.created_at)}</div><p><button class="btn" onclick="vM(${i})">عرض ${x.file_type.includes('pdf')?'PDF':'الصورة'}</button>${U.role==='admin'||U.id===x.author_id?` <button class="x" onclick="dM(${i})">حذف</button>`:''}</p></div>`).join(''):'<p class="note">لا توجد محاضرات مرفوعة بعد.</p>'}
function vM(i){const x=MAT[i],u=sb.storage.from('materials').getPublicUrl(x.file_path).data.publicUrl;
const b=x.file_type.includes('pdf')?`<iframe src="${u}" style="width:100%;height:70vh;border:0"></iframe><p><a href="${u}" target="_blank" rel="noopener">فتح في نافذة جديدة</a></p>`:`<img src="${u}" style="max-width:100%" alt="">`;
$('#mv').innerHTML=`<div class="card"><button class="x" onclick="$('#mv').innerHTML=''">إغلاق</button>${b}</div>`;$('#mv').scrollIntoView()}
async function dM(i){const x=MAT[i];if(!confirm('حذف المحاضرة؟'))return;await sb.storage.from('materials').remove([x.file_path]);await sb.from('materials').delete().eq('id',x.id);loadM()}

const GC={all:'الكل',campus:'المبنى والساحات',halls:'القاعات والمدرجات',stud:'رعاية الطلاب والإنجازات'};
const G=[['entrance','campus','البوابة الرئيسية للمعهد ليلاً'],['entrance-side','campus','المدخل والنافورات'],['entrance-fountain','campus','إطلالة على المدخل ونافورته'],['courtyard','campus','الساحة الداخلية والمبنى'],['courtyard-lit','campus','الساحة الداخلية مضاءة ليلاً'],['hall-large','halls','المدرج الكبير'],['hall-benches','halls','المدرج الكبير من منصة المحاضر'],['hall-wood','halls','مدرج بمقاعد خشبية'],['hall-wood2','halls','قاعة محاضرات'],['class-screen','halls','قاعة دراسية بشاشة عرض'],['class-mural','halls','قاعة دراسية بجدارية فنية'],['cabinet','stud','خزانة إنجازات رعاية الطلاب'],['trophies','stud','كؤوس وبطولات المعهد'],['first-place','stud','كأس المركز الأول'],['plaques','stud','دروع تقدير من رعاية الطلاب']];
let GF='all',LB=0,LBL=[];
const ph=(g,i,big)=>`<button class="ph${big?' big':''}" onclick="openLB('${g[0]}')" aria-label="${g[2]}"><img src="images/${g[0]}.webp" width="1280" height="720" loading="lazy" decoding="async" alt="${g[2]}"><span>${g[2]}</span></button>`;
function galPage(){const l=G.filter(g=>GF=='all'||g[1]==GF);LBL=l;
return `<h2>صور من أرض الواقع</h2><p class="note">جولة داخل معهد السويس العالي لنظم المعلومات الإدارية: المبنى والساحات، القاعات والمدرجات، وإنجازات الطلاب.</p><div class="tabs">${Object.entries(GC).map(([k,v])=>`<button class="${GF==k?'on':''}" onclick="GF='${k}';render()">${v}</button>`).join('')}</div><div class="gal">${l.map((g,i)=>ph(g,i,i==0&&GF=='all')).join('')}</div>`}
const galTeaser=()=>`<h2>جولة في المعهد</h2><div class="gal sm">${[0,5,3,11].map(i=>ph(G[i],i)).join('')}</div><p><button class="btn" onclick="go('gallery')">عرض كل الصور</button></p>`;
function openLB(id){if(!LBL.some(g=>g[0]==id))LBL=G;LB=LBL.findIndex(g=>g[0]==id);let e=$('#lb');if(!e){document.body.insertAdjacentHTML('beforeend','<div id="lb" hidden role="dialog" aria-modal="true" aria-label="معرض الصور"><button class="c" onclick="closeLB()" aria-label="إغلاق">✕</button><button class="n" onclick="stepLB(1)" aria-label="التالية">›</button><button class="v" onclick="stepLB(-1)" aria-label="السابقة">‹</button><figure><img id="lbi" alt=""><figcaption id="lbc"></figcaption></figure></div>');e=$('#lb');e.onclick=ev=>{if(ev.target===e)closeLB()}}
e.hidden=false;showLB()}
function showLB(){const g=LBL[LB];$('#lbi').src='images/'+g[0]+'.webp';$('#lbi').alt=g[2];$('#lbc').innerHTML=g[2]+' <small>('+(LB+1)+'/'+LBL.length+')</small>'}
function stepLB(d){LB=(LB+d+LBL.length)%LBL.length;showLB()}
function closeLB(){$('#lb').hidden=true}
addEventListener('keydown',e=>{const l=$('#lb');if(!l||l.hidden)return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')stepLB(-1);if(e.key==='ArrowLeft')stepLB(1)});

render();
</script>
